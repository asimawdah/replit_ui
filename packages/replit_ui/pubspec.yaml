name: replit_ui
description: Flutter UI components and optional streaming AI chat providers for Gemini, OpenAI and Claude.
version: 0.4.1
homepage: https://replit.asimawdah.com/
repository: https://github.com/asimawdah/replit_ui/tree/main/packages/replit_ui
issue_tracker: https://github.com/asimawdah/replit_ui/issues
documentation: https://replit.asimawdah.com/
topics:
  - ai
  - chat
  - chatbot
  - assistant
  - ui

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  # The composer's built-in attach button opens this. flutter.dev-published
  # and endorsed on all six platforms, and — unlike image_picker — it adds
  # no permission, no FileProvider and no Play-services entry to a host's
  # Android manifest, and no Info.plist strings to a host's iOS build. The
  # one thing a host must do is a macOS entitlement
  # (com.apple.security.files.user-selected.read-only); without it the
  # dialog opens onto nothing. Hosts that never wire an attach callback
  # ship this and configure nothing.
  file_selector: ^1.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/replit_thinking_sprite.png
